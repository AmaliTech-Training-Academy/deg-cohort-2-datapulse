<div class="panel">
  <div class="panel__header">
    <h2 class="panel__title">Integrations</h2>
    <p class="panel__subtitle">Connect DataPulse with external tools and services</p>
  </div>
  <div class="integration-item">
    <div class="integration-icon">S</div>
    <div class="integration-body">
      <p class="integration-name">Slack</p>
      <p class="integration-desc">Send alerts and digests to a Slack channel</p>
    </div>
    <button class="btn-connect" type="button">Connect</button>
  </div>
  <div class="integration-item">
    <div class="integration-icon">W</div>
    <div class="integration-body">
      <p class="integration-name">Webhooks</p>
      <p class="integration-desc">POST alert payloads to any HTTP endpoint</p>
    </div>
    <button class="btn-connect" type="button">Configure</button>
  </div>
  <div class="integration-item">
    <div class="integration-icon">G</div>
    <div class="integration-body">
      <p class="integration-name">GitHub Actions</p>
      <p class="integration-desc">Trigger checks in your CI/CD pipeline</p>
    </div>
    <button class="btn-connect" type="button">Connect</button>
  </div>
</div>
