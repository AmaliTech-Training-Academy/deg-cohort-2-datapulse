<div class="panel">
  <div class="panel__header">
    <h2 class="panel__title">General</h2>
    <p class="panel__subtitle">Basic organization settings</p>
  </div>
  <div class="form-group">
    <label class="form-label" for="org-name">ORGANIZATION NAME</label>
    <input id="org-name" class="form-input" type="text" [(ngModel)]="orgName" />
  </div>
  <div class="form-group">
    <label class="form-label" for="timezone">TIMEZONE</label>
    <select id="timezone" class="form-input">
      <option>UTC</option>
      <option>America/New_York</option>
      <option>Europe/London</option>
      <option>Asia/Tokyo</option>
    </select>
  </div>
  <button class="btn-primary" type="button">Save changes</button>
</div>
