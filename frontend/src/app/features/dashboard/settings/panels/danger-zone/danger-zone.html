<div class="panel">
  <div class="panel__header">
    <h2 class="panel__title">Danger zone</h2>
    <p class="panel__subtitle">Irreversible actions — proceed with extreme caution</p>
  </div>
  <div class="danger-item">
    <div>
      <p class="danger-item__title">Delete organization</p>
      <p class="danger-item__desc">
        Permanently remove this organization and all its data. This cannot be undone.
      </p>
    </div>
    <button class="btn-danger" type="button" (click)="onDeleteOrg()">Delete organization</button>
  </div>
