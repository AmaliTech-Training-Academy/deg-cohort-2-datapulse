<aside class="sidebar">
  <div class="sidebar__brand">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" class="sidebar__logo">
      <rect width="28" height="28" rx="8" fill="#2563eb" />
      <path
        d="M8 14l4 4 8-8"
        stroke="white"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="sidebar__brand-name">DataPulse</span>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="sidebar__nav-item--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard/projects' ? false : false }"
        class="sidebar__nav-item"
        [attr.aria-label]="item.label"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="sidebar__nav-icon"
        >
          <path [attr.d]="item.icon" />
        </svg>
        <span class="sidebar__nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
