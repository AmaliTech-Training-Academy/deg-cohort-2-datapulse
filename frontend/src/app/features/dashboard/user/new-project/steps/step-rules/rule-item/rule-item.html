<div class="rule-item" [class.rule-item--disabled]="!rule().enabled">
  <div class="rule-icon">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path [attr.d]="ruleTypeIcon(rule().type)" />
    </svg>
  </div>

  <div class="rule-body">
    <div class="rule-name">
      {{ rule().name }}
      <span class="rule-column">{{ rule().column }}</span>
    </div>
    <p class="rule-desc">{{ rule().description }}</p>
  </div>

  <div class="rule-actions">
    <button
      class="rule-action-btn rule-action-btn--edit"
      type="button"
      [attr.aria-label]="'Edit ' + rule().name"
      (click)="editClicked.emit(rule().id)"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
    <button
      class="rule-action-btn rule-action-btn--delete"
      type="button"
      [attr.aria-label]="'Delete ' + rule().name"
      (click)="deleteClicked.emit(rule().id)"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
    </button>
  </div>

  <label class="toggle" [attr.aria-label]="'Toggle ' + rule().name">
    <input type="checkbox" [checked]="rule().enabled" (change)="toggled.emit(rule().id)" />
    <span class="toggle__track"></span>
  </label>
</div>
