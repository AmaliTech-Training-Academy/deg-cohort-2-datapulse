<app-auth-layout subtitle="Enter your email and we'll send you a link to reset your password.">
  @if (sent()) {
    <div class="reset-success">
      <div class="reset-success__icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
      </div>
      <h3 class="reset-success__title">Check your email</h3>
      <p class="reset-success__message">
        We sent a password reset link to <strong>{{ form.value.email }}</strong>. Check your inbox and follow the instructions.
      </p>
      <a routerLink="/login" class="reset-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back to sign in
      </a>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
      @if (error()) {
        <div class="auth-alert" role="alert">{{ error() }}</div>
      }

      <app-input
        label="Email"
        type="email"
        placeholder="jordan@company.com"
        autocomplete="email"
        formControlName="email"
      />

      <app-button type="submit" [loading]="loading()" [fullWidth]="true">
        Send reset link
      </app-button>

      <p class="auth-footer">
        <a routerLink="/login" class="reset-back-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
          Back to sign in
        </a>
      </p>
    </form>
  }
</app-auth-layout>
