<app-auth-layout subtitle="Monitor the quality of every dataset you ship.">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
    @if (error()) {
      <div class="auth-alert" role="alert">{{ error() }}</div>
    }

    <app-input
      label="Email"
      type="email"
      placeholder="jordan@company.com"
      autocomplete="email"
      formControlName="email"
    />

    <app-input
      label="Password"
      type="password"
      placeholder="••••••••"
      autocomplete="current-password"
      formControlName="password"
    >
      <a labelAction routerLink="/reset-password" class="field-action">Forgot password?</a>
    </app-input>

    <app-button type="submit" [loading]="loading()" [fullWidth]="true"> Sign in </app-button>

    <p class="auth-footer">New to DataPulse? <a routerLink="/register">Create an account</a></p>
  </form>
</app-auth-layout>
