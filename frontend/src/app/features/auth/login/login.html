<app-auth-layout subtitle="Monitor the quality of every dataset you ship.">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
    @if (error()) {
      <div class="auth-alert" role="alert">{{ error() }}</div>
    }

    <app-input
      label="Email"
      type="email"
      placeholder="jordan@company.com"
      autocomplete="email"
      formControlName="email"
    />

    <app-input
      label="Password"
      type="password"
      placeholder="••••••••"
      autocomplete="current-password"
      formControlName="password"
    >
      <a labelAction routerLink="/reset-password" class="field-action">Forgot password?</a>
    </app-input>

    <app-button type="submit" [loading]="loading()" [fullWidth]="true"> Sign in </app-button>

    <p class="auth-footer">New to DataPulse? <a routerLink="/register">Create an account</a></p>
  </form>

  @if (isDev) {
    <div class="dev-shortcuts">
      <p class="dev-shortcuts__label">Dev shortcuts</p>
      <div class="dev-shortcuts__buttons">
        <button class="dev-btn dev-btn--admin" type="button" (click)="devLogin('admin')">
          Login as Admin
        </button>
        <button class="dev-btn dev-btn--user" type="button" (click)="devLogin('user')">
          Login as User
        </button>
      </div>
    </div>
  }
</app-auth-layout>
