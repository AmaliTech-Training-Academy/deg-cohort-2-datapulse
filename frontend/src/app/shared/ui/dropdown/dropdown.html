<div class="select-field" [class.select-field--error]="showError">
  @if (label()) {
    <label [for]="selectId" class="select-field__label">{{ label() }}</label>
  }

  <div class="select-field__wrap">
    <select
      [id]="selectId"
      class="select-field__select"
      [value]="value"
      [disabled]="isDisabled"
      (change)="handleChange($event)"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value">{{ placeholder() }}</option>
      }
      @for (opt of options(); track opt.value) {
        <option [value]="opt.value" [selected]="value === opt.value">{{ opt.label }}</option>
      }
    </select>

    <span class="select-field__arrow" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </span>
  </div>

  @if (showError && errorMessage) {
    <p class="select-field__error" role="alert">{{ errorMessage }}</p>
  }
</div>
