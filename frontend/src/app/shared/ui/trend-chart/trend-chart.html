@if (chartData(); as data) {
  <svg
    class="trend-chart"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
    preserveAspectRatio="xMidYMid meet"
  >
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--color-primary)" stop-opacity="0.18" />
        <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0" />
      </linearGradient>
    </defs>

    @for (yl of data.yLabels; track yl.label) {
      <line
        [attr.x1]="data.pad.left"
        [attr.y1]="yl.y"
        [attr.x2]="width() - data.pad.right"
        [attr.y2]="yl.y"
        stroke="var(--color-border)"
        stroke-width="1"
      />
      <text
        [attr.x]="data.pad.left - 6"
        [attr.y]="yl.y + 4"
        text-anchor="end"
        class="chart__axis-label"
      >{{ yl.label }}</text>
    }

    @if (data.isSinglePoint) {
      <line
        [attr.x1]="data.pad.left"
        [attr.y1]="data.coords[0].y"
        [attr.x2]="width() - data.pad.right"
        [attr.y2]="data.coords[0].y"
        stroke="var(--color-primary)"
        stroke-width="1.5"
        stroke-dasharray="5 4"
        opacity="0.5"
      />
    } @else {
      <path [attr.d]="data.areaPath" [attr.fill]="'url(#' + gradientId + ')'" />
      <polyline
        [attr.points]="data.polylinePoints"
        fill="none"
        stroke="var(--color-primary)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }

    @for (c of data.coords; track c.label) {
      <circle
        [attr.cx]="c.x"
        [attr.cy]="c.y"
        r="4"
        fill="var(--color-surface)"
        stroke="var(--color-primary)"
        stroke-width="2"
      />
      <text
        [attr.x]="c.x"
        [attr.y]="data.pad.top + data.chartH + 20"
        text-anchor="middle"
        class="chart__axis-label"
      >{{ c.label }}</text>
      <text
        [attr.x]="c.x"
        [attr.y]="c.y - 10"
        text-anchor="middle"
        class="chart__data-label"
      >{{ c.score }}</text>
    }
  </svg>
} @else {
  <p class="trend-chart__empty">Not enough data</p>
}
