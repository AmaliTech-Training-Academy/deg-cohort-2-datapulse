name: DataPulse CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------
  # BACKEND LINT
  # ------------------------------------------------------
  lint-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 backend --max-line-length=120

  # ------------------------------------------------------
  # BACKEND TESTS
  # ------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend

    env:
      SECRET_KEY: test-secret-key-for-ci-only-minimum-32-bytes!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ -v --tb=short || [ $? -eq 5 ]

  # ------------------------------------------------------
  # DATA ENGINEERING TESTS
  # ------------------------------------------------------
  test-data-engineering:
    runs-on: ubuntu-latest

    services:
      analytics-db:
        image: postgres:15
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TARGET_DB_URL: postgresql://analytics:analytics_pass@localhost:5432/analytics_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r data-engineering/requirements.txt pytest

      - name: Load schema
        run: psql $TARGET_DB_URL -f data-engineering/sql/analytics_schema.sql

      - name: Load fixtures
        run: psql $TARGET_DB_URL -f data-engineering/tests/fixtures/test_data.sql

      - name: Run tests
        run: pytest data-engineering/tests/ -v --tb=short

  # ------------------------------------------------------
  # FRONTEND TESTS
  # ------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e

  # ------------------------------------------------------
  # BUILD IMAGES ONCE
  # ------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-data-engineering
      - test-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t datapulse-backend:${{ github.sha }} \
            ./backend

      - name: Build pipeline image
        run: |
          docker build \
            -t datapulse-pipeline:${{ github.sha }} \
            ./data-engineering

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            -t datapulse-frontend:${{ github.sha }} \
            ./frontend

      - name: Save backend image
        run: docker save datapulse-backend:${{ github.sha }} -o backend.tar

      - name: Save pipeline image
        run: docker save datapulse-pipeline:${{ github.sha }} -o pipeline.tar

      - name: Save frontend image
        run: docker save datapulse-frontend:${{ github.sha }} -o frontend.tar

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar

      - name: Upload pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-image
          path: pipeline.tar

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend.tar

  # ------------------------------------------------------
  # TRIVY SCAN
  # ------------------------------------------------------
  scan-images:
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Download pipeline image
        uses: actions/download-artifact@v4
        with:
          name: pipeline-image

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      - name: Load backend image
        run: docker load -i backend.tar

      - name: Load pipeline image
        run: docker load -i pipeline.tar

      - name: Load frontend image
        run: docker load -i frontend.tar

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datapulse-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan pipeline image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datapulse-pipeline:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datapulse-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: [scan-images, test-frontend]
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-backend:latest \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-backend:${{ github.sha }} \
            ./backend
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-backend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-backend:${{ github.sha }}

      - name: Build and push pipeline
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:latest \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:${{ github.sha }} \
            ./data-engineering
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:latest
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:latest \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:${{ github.sha }}

  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment:
      name: staging
      url: http://${{ vars.STAGING_EC2_HOST }}
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY
          script: |
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            if [ ! -d ~/datapulse ]; then
              git clone https://github.com/AmaliTech-Training-Academy/deg-cohort-2-datapulse.git ~/datapulse
            fi

            cd ~/datapulse
            git pull origin dev

            ECR_REGISTRY=$ECR_REGISTRY docker-compose -f docker-compose.prod.yml pull
            ECR_REGISTRY=$ECR_REGISTRY docker-compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Smoke test staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_EC2_HOST }}
        run: |
          # wait for containers to be ready
          sleep 20
          curl --fail --retry 5 --retry-delay 5 http://$STAGING_HOST/
          curl --fail --retry 5 --retry-delay 5 http://$STAGING_HOST/api/docs/
          curl --fail --retry 10 --retry-delay 5 --retry-all-errors http://$STAGING_HOST/analytics/
