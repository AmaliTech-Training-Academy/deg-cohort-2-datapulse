name: DataPulse CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 backend --max-line-length=120

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    env:
      SECRET_KEY: test-secret-key-for-ci-only-minimum-32-bytes!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest tests/ -v --tb=short || [ $? -eq 5 ]

  test-data-engineering:
    runs-on: ubuntu-latest
    services:
      analytics-db:
        image: postgres:15
        env:
          POSTGRES_DB: analytics_test
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TARGET_DB_URL: postgresql://analytics:analytics_pass@localhost:5432/analytics_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r data-engineering/requirements.txt pytest
      - run: psql $TARGET_DB_URL -f data-engineering/sql/analytics_schema.sql
      - run: psql $TARGET_DB_URL -f data-engineering/tests/fixtures/test_data.sql
      - run: pytest data-engineering/tests/ -v --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-data-engineering]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker build -t datapulse-backend ./backend
      - run: docker compose config > /dev/null && echo "docker-compose config valid"

  scan-images:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image for scanning
        run: docker build -t datapulse-backend:scan ./backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datapulse-backend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      - name: Build pipeline image for scanning
        run: docker build -t datapulse-pipeline:scan ./data-engineering
      - name: Scan pipeline image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datapulse-pipeline:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true
      - name: Build frontend image for scanning
        run: docker build -f frontend/Dockerfile.prod -t datapulse-frontend:scan ./frontend
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datapulse-frontend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

  push-to-ecr:
    runs-on: ubuntu-latest
    needs: [scan-images, test-frontend]
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-backend:latest \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-backend:${{ github.sha }} \
            ./backend
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-backend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-backend:${{ github.sha }}

      - name: Build and push pipeline
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:latest \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:${{ github.sha }} \
            ./data-engineering
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:latest
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-pipeline:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:latest \
            -t ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:latest
          docker push ${{ secrets.ECR_REGISTRY }}/datapulse-frontend:${{ github.sha }}

  deploy-to-staging:
    runs-on: ubuntu-latest
    needs: push-to-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment:
      name: staging
      url: http://${{ secrets.STAGING_EC2_HOST }}
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY
          script: |
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            if [ ! -d ~/datapulse ]; then
              git clone https://github.com/AmaliTech-Training-Academy/deg-cohort-2-datapulse.git ~/datapulse
            fi

            cd ~/datapulse
            git pull origin dev

            ECR_REGISTRY=$ECR_REGISTRY docker-compose -f docker-compose.prod.yml pull
            ECR_REGISTRY=$ECR_REGISTRY docker-compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Smoke test staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_EC2_HOST }}
        run: |
          # wait for containers to be ready
          sleep 20
          curl --fail --retry 5 --retry-delay 5 http://$STAGING_HOST/
          curl --fail --retry 5 --retry-delay 5 http://$STAGING_HOST/api/docs/
