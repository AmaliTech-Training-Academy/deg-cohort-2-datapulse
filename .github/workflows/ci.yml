name: DataPulse CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 backend --max-line-length=120

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    env:
      SECRET_KEY: test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest tests/ -v --tb=short || [ $? -eq 5 ]

  test-data-engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r data-engineering/requirements.txt
      - run: |
          python -m py_compile data-engineering/pipeline/etl_pipeline.py
          python -m py_compile data-engineering/pipeline/data_models.py
          echo "Data engineering modules OK"

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-data-engineering]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker build -t datapulse-backend ./backend
      - run: docker compose config > /dev/null && echo "docker-compose config valid"
