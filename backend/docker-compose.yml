# ─────────────────────────────────────────────────────────────────────────────
# DataPulse — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   db   — PostgreSQL 15 (database)
#   web  — Django 5 development server
#
# Usage:
#   docker compose up --build        start everything
#   docker compose down              stop containers
#   docker compose down -v           stop + delete all data volumes
#   docker compose exec web bash     open a shell inside the Django container
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_db
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       datapulse
      POSTGRES_USER:     datapulse_user
      POSTGRES_PASSWORD: datapulse_pass
    volumes:
      # Named volume: data persists across docker compose down / up
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose on port 5433 to avoid conflict with any local PostgreSQL
      - "5433:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U datapulse_user -d datapulse"]
      interval: 5s
      timeout:  5s
      retries:  5

  # ── Django web application ─────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    # Run migrations then start the development server
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_db &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY:            ${SECRET_KEY:-dev-insecure-key-change-in-production}
      DEBUG:                 ${DEBUG:-True}
      ALLOWED_HOSTS:         ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME:               datapulse
      DB_USER:               datapulse_user
      DB_PASSWORD:           datapulse_pass
      DB_HOST:               db          # must match the service name above
      DB_PORT:               5432
      CORS_ALLOWED_ORIGINS:  ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_ACCESS_TOKEN_HOURS: ${JWT_ACCESS_TOKEN_HOURS:-24}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      LOG_LEVEL:             ${LOG_LEVEL:-INFO}
    volumes:
      # Mount source code for live reload during development
      - .:/app
      # CRITICAL: Mount media directory so uploaded files survive restarts
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until PostgreSQL is ready

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
