# ─────────────────────────────────────────────────────────────────────────────
# DataPulse — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# All credentials and configuration come from .env — never hardcoded here.
# Copy .env.example to .env and fill in values before running.
#
# Usage:
#   docker compose up --build          start everything, rebuild images
#   docker compose up -d               start in background
#   docker compose down                stop and remove containers
#   docker compose down -v             stop and delete all data volumes
#   docker compose logs -f web         tail Django logs
#   docker compose exec web bash       shell inside the running web container
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_db
#   docker compose exec web python manage.py createsuperuser
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-datapulse}
      POSTGRES_USER: ${DB_USER:-datapulse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-datapulse_pass}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-datapulse_user} -d ${DB_NAME:-datapulse}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django web application ─────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_db &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      # These two override whatever is in .env — inside Docker the service
      # names are the correct hostnames, not localhost.
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      # Named volume keeps uploaded files alive across container restarts.
      # Without this, every docker compose down wipes all uploaded datasets.
      - media_data:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
  media_data:
