[pytest]
# Tell pytest-django where the settings module lives
DJANGO_SETTINGS_MODULE = config.test_settings

# Test discovery — look for files matching this pattern
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

# Default options:
#   -v         verbose output (shows each test name)
#   --tb=short minimal traceback for failures
addopts = -v --tb=short

# Treat all warnings as errors during testing to catch Django deprecation issues
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
